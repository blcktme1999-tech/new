    <h1>孤毒的剪影</h1>
    <p class="meta">發布日期：111-04-01｜發布單位：刑事警察局預防科</p>
    <article class="article-body"><div class=editor>
 <div class="ed_model01 clearfix">
<div class=ed_txt>許多事情一旦做了，就無法裝作沒有發生；<br>
傷害一旦造成，再怎麼彌補都會留下傷痕。<br>
逃避與麻醉自己不能解決任何問題，<br>
守護所愛的人，從珍惜自己開始。<br>
<br>
反毒拒毒，你不孤獨。</div>
